<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AI Citation Scoreboard</title>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{ --ink:#161616; --sec:#4a5261; --muted:#8a93a3; --faint:#b7bfce; --line:#e8ebf0; --surface:#fbfcfe; --blue:#2467E3; --blue-dk:#1c4fa6; --wash:#f2f6ff; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:#f4f7fc; font-family:'Satoshi',system-ui,sans-serif; color:var(--ink); -webkit-font-smoothing:antialiased; }
  .page{ max-width:1240px; margin:0 auto; padding:24px 20px 80px; }
  .bar{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .btn{ font-family:inherit; font-size:14px; font-weight:700; color:#fff; background:var(--blue); border:0; border-radius:40px; padding:11px 20px; cursor:pointer; }
  .btn.ghost{ background:transparent; color:var(--sec); border:1px solid var(--line); }
  .btn:disabled{ opacity:.5; cursor:default; }
  .status{ color:var(--muted); font-size:13.5px; margin-right:auto; }

  #card{ width:1200px; max-width:100%; background:linear-gradient(180deg,#ffffff 0%,#fbfcfe 100%); border:1px solid var(--line); border-radius:20px; padding:44px 50px 40px; }
  .top{ display:flex; align-items:center; gap:12px; }
  .eyebrow{ color:var(--blue); font-weight:700; font-size:13px; letter-spacing:.2em; text-transform:uppercase; }
  .tag{ font-size:10.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--blue); border:1px solid rgba(36,103,227,.4); border-radius:20px; padding:3px 10px; }
  h1{ font-weight:900; font-size:31px; line-height:1.1; letter-spacing:-.025em; margin:14px 0 6px; }
  .sub{ color:var(--sec); font-size:15px; font-weight:500; max-width:72ch; }
  .cardrow{ display:flex; gap:40px; margin-top:24px; align-items:center; }
  .big{ width:240px; flex-shrink:0; }
  .big .n{ font-weight:900; font-size:76px; line-height:.86; color:var(--blue); letter-spacing:-.04em; }
  .big .n .d{ font-size:40px; color:var(--faint); }
  .big .l{ color:var(--sec); font-size:14.5px; font-weight:600; margin-top:10px; line-height:1.4; }
  .legend{ margin-top:16px; }
  .lg{ display:flex; align-items:center; gap:9px; margin-bottom:8px; font-size:13.5px; font-weight:600; color:var(--sec); }
  .lg .sw{ width:15px; height:15px; border-radius:50%; } .lg .own{ background:var(--blue); } .lg .miss{ background:#fff; border:2px solid #cfd6e0; }
  .lg b{ color:var(--ink); }
  .matrix{ flex:1; display:grid; gap:11px; align-self:center; }
  .cell{ width:100%; aspect-ratio:1; border-radius:50%; }
  .cell.own{ background:var(--blue); box-shadow:0 3px 8px rgba(36,103,227,.24); }
  .cell.miss{ background:#fff; border:2px solid #d5dae3; }

  .vs{ margin-top:26px; padding-top:22px; border-top:1px solid var(--line); }
  .vs .h{ font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:800; margin-bottom:14px; }
  .vsrow{ display:flex; align-items:center; gap:14px; margin-bottom:10px; }
  .vsrow .lab{ width:220px; font-size:14.5px; font-weight:700; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .vsrow.rival .lab{ color:var(--sec); font-weight:600; }
  .vsrow .track{ flex:1; height:16px; background:#eef1f6; border-radius:8px; overflow:hidden; }
  .vsrow .fill{ display:block; height:16px; border-radius:8px; }
  .vsrow.you .fill{ background:var(--blue); } .vsrow.rival .fill{ background:#b7bfce; }
  .vsrow .val{ width:72px; text-align:right; font-size:14px; font-weight:800; color:var(--ink); flex-shrink:0; }

  .cardfoot{ display:flex; justify-content:space-between; align-items:center; margin-top:26px; border-top:1px solid var(--line); padding-top:16px; }
  .cardfoot .note{ color:var(--muted); font-size:12px; } .cardfoot .wm{ font-weight:900; font-size:17px; letter-spacing:.14em; }

  .cols{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:26px; }
  .col{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px 22px; }
  .col h2{ font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:800; margin-bottom:14px; }
  .q{ display:flex; align-items:flex-start; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .q:last-child{ border-bottom:0; }
  .q .ic{ width:18px; height:18px; border-radius:50%; flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:900; }
  .q.own .ic{ background:var(--blue); color:#fff; } .q.miss .ic{ background:#eef0f4; color:#8a93a3; }
  .q .txt{ color:var(--ink); } .q.miss .txt{ color:var(--sec); }
  .open{ background:var(--wash); border:1px solid #dce6fb; border-radius:16px; padding:20px 22px; margin-top:20px; }
  .open h2{ font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--blue-dk); font-weight:800; margin-bottom:6px; }
  .open p{ color:var(--sec); font-size:14px; margin-bottom:12px; }
  .opit{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid #e3ebfb; font-size:14.5px; }
  .opit:last-child{ border-bottom:0; }
  .opit .h{ font-weight:700; } .opit .m{ color:var(--muted); font-size:13px; }
  #err{ color:#b93a2e; font-weight:600; padding:20px 0; }
</style>
</head>
<body>
<div class="page">
  <div class="bar">
    <span class="status" id="status"></span>
    <button class="btn ghost" id="again" style="display:none" onclick="location.reload()">Reload</button>
    <button class="btn" id="dl" disabled onclick="downloadCard()">Download scoreboard</button>
  </div>

  <div id="card">
    <div class="top"><span class="eyebrow">AI Citation Scoreboard</span><span class="tag" id="tag">Illustrative</span></div>
    <h1 id="h1">&nbsp;</h1>
    <div class="sub" id="sub"></div>
    <div class="cardrow">
      <div class="big">
        <div class="n"><span id="x">–</span><span class="d">/<span id="n">–</span></span></div>
        <div class="l">questions where AI cites this business</div>
        <div class="legend">
          <div class="lg"><span class="sw own"></span><b id="lg-own">–</b>&nbsp;&middot;&nbsp;defend these</div>
          <div class="lg"><span class="sw miss"></span><b id="lg-miss">–</b>&nbsp;&middot;&nbsp;the next targets</div>
        </div>
      </div>
      <div class="matrix" id="matrix"></div>
    </div>
    <div class="vs" id="vs" style="display:none"></div>
    <div class="cardfoot"><div class="note" id="foot-note">Live scan across your category's key buyer questions &middot; Specularis</div><div class="wm">SPECULARIS</div></div>
  </div>

  <div id="detail"></div>
  <div id="err"></div>
</div>

<script>
  var P=new URLSearchParams(location.search);
  var d=(P.get('d')||'').trim(), k=(P.get('k')||'').trim(), seed=(P.get('seed')||'').trim();
  var demo=P.get('demo')==='1' || (!d);
  var S=document.getElementById('status');

  var STEMS=["who are the best real estate agents","top real estate agent near me","best agent for first-time buyers","how do I choose a real estate agent","what to look for in a realtor","best agent for luxury homes","agent for relocating families","is it worth hiring a realtor","compare real estate agents in the area","best agent for selling quickly","top realtors 2026","best agent for condos","best agent for investment properties","realtor for downsizing","agent for military families","best agent for new construction","realtor who speaks Spanish","best agent for waterfront homes","agent for first-time sellers","best low-commission agent","realtor for probate sales","best agent for fixer-uppers","agent for out-of-state buyers","best luxury real estate agent","realtor for 55+ communities","best agent for short sales","agent for vacation-rental investors","top-rated realtor reviews","best agent for negotiating price","realtor for townhomes","best agent for a fast closing","agent for divorce home sales","best realtor for buyers","best realtor for sellers","agent for historic homes","realtor for a specific school district","best agent for cash buyers","best agent for a starter home","realtor for eco-friendly homes","who is the best realtor for me"];
  var DEMO={ host:"your-business.com", host2:"a competing brokerage", engines:["Perplexity","Claude","Gemini","ChatGPT"],
    runs: STEMS.map(function(q,i){ return { query:q, owned:i<27 }; }),
    rival:{ host:"a competing brokerage", citedIn:18, ofQueries:40 },
    openings:[ {host:"expertise.com", m:"cited in 22 of 40 answers · you’re not in it"},
      {host:"fastexpert.com", m:"cited in 15 of 40 answers · you’re not in it"},
      {host:"a local “best of” roundup", m:"cited in 11 of 40 answers · you’re not in it"} ] };

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function render(m){
    var total=m.total!=null?m.total:(m.runs||[]).length;
    var cited=m.cited!=null?m.cited:(m.runs||[]).filter(function(r){return r.owned;}).length;
    document.getElementById('tag').textContent = demo?'Illustrative':'Live result';
    document.getElementById('h1').textContent = 'Cited in '+cited+' of the '+total+' questions AI gets asked in this category';
    document.getElementById('sub').textContent = demo
      ? 'Across the key questions customers ask AI, here is what this business wins, what it is missing, and how it stacks up against its top competitor.'
      : 'For '+m.host+', across the key questions customers ask AI in this category.';
    var eng=(m.engines||[]);
    if(eng.length){ var el=eng.length>1?eng.slice(0,-1).join(', ')+' & '+eng[eng.length-1]:eng[0];
      document.getElementById('foot-note').innerHTML='Scanned across '+esc(el)+' · Specularis'; }
    document.getElementById('x').textContent=cited;
    document.getElementById('n').textContent=total;
    document.getElementById('lg-own').textContent=cited+' owned';
    document.getElementById('lg-miss').textContent=(total-cited)+' missing';
    var cols=total<=10?total:10;
    var mx=document.getElementById('matrix'); mx.style.gridTemplateColumns='repeat('+cols+',1fr)'; mx.innerHTML='';
    for(var i=0;i<total;i++){ var c=document.createElement('div'); c.className='cell '+(i<cited?'own':'miss'); mx.appendChild(c); }

    var vs=document.getElementById('vs');
    if(m.rival && total){
      var yp=Math.round(cited/total*100), rp=Math.round(m.rival.citedIn/total*100);
      vs.style.display='block';
      vs.innerHTML='<div class="h">Share of voice &middot; you vs your top competitor</div>'+
        '<div class="vsrow you"><span class="lab">'+esc(m.host)+'</span><span class="track"><span class="fill" style="width:'+yp+'%"></span></span><span class="val">'+cited+' / '+total+'</span></div>'+
        '<div class="vsrow rival"><span class="lab">'+esc(m.rival.host)+'</span><span class="track"><span class="fill" style="width:'+rp+'%"></span></span><span class="val">'+m.rival.citedIn+' / '+total+'</span></div>';
    } else vs.style.display='none';

    var owned=(m.runs||[]).filter(function(r){return r.owned;});
    var missing=(m.runs||[]).filter(function(r){return !r.owned;});
    var det=document.getElementById('detail'); det.innerHTML='';
    var c=document.createElement('div'); c.className='cols';
    c.innerHTML =
      '<div class="col"><h2>You own '+owned.length+' &middot; defend these</h2>'+
        owned.map(function(r){return '<div class="q own"><span class="ic">✓</span><span class="txt">'+esc(r.query)+'</span></div>';}).join('')+'</div>'+
      '<div class="col"><h2>Missing '+missing.length+' &middot; your next targets</h2>'+
        (missing.length?missing.map(function(r){return '<div class="q miss"><span class="ic">×</span><span class="txt">'+esc(r.query)+'</span></div>';}).join(''):'<div class="q"><span class="txt" style="color:#8a93a3">You appear in every question we tested.</span></div>')+'</div>';
    det.appendChild(c);

    if((m.openings||[]).length){
      var op=document.createElement('div'); op.className='open';
      op.innerHTML='<h2>Fastest openings</h2><p>Sources AI keeps citing for this category that you are not in yet. Get cited in these and you close the gap fastest.</p>'+
        m.openings.map(function(o){return '<div class="opit"><span class="h">'+esc(o.host)+'</span><span class="m">'+esc(o.m)+'</span></div>';}).join('');
      det.appendChild(op);
    }
    document.getElementById('dl').disabled=false; S.textContent='';
  }

  function downloadCard(){
    var card=document.getElementById('card'), b=document.getElementById('dl'); b.disabled=true; S.textContent='Rendering…';
    html2canvas(card,{scale:2, backgroundColor:'#ffffff', logging:false}).then(function(cv){
      cv.toBlob(function(bl){ var a=document.createElement('a'); a.href=URL.createObjectURL(bl); a.download='ai-citation-scoreboard.png'; document.body.appendChild(a); a.click(); a.remove(); S.textContent='Downloaded.'; b.disabled=false; },'image/png');
    }).catch(function(){ S.textContent='Could not render — screenshot the card instead.'; b.disabled=false; });
  }

  if(demo){ render(DEMO); }
  else {
    S.textContent='Running the scoreboard scan across ~40 questions… this takes a minute or two.';
    var url='/api/scoreboard-scan?d='+encodeURIComponent(d)+(k?'&k='+encodeURIComponent(k):'')+(seed?'&seed='+encodeURIComponent(seed):'');
    fetch(url).then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
      .then(function(res){
        var j=res.j;
        if(!res.ok || j.error){ document.getElementById('err').textContent = j.error || 'Something went wrong.'; document.getElementById('again').style.display=''; S.textContent=''; return; }
        render(j);
      })
      .catch(function(){ document.getElementById('err').textContent='Network error.'; document.getElementById('again').style.display=''; S.textContent=''; });
  }
</script>
</body>
</html>
